<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My book</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="top-section">
            <span>Books</span>
            <button id="open-add-book-dialog">+ Add book</button>
        </div>
        <dialog id="add-book-dialog" aria-labelledby="form-title">
            <form method="dialog">
                <button class="close-form" aria-lable="Close form">Close</button>

                <h2 id="form-title">Add book</h2>
                <label for="name">Book name</label>
                <input id="name" name="name" autocomplete="name" required>

                <label for="author">Author</label>
                <input id="author" name="author">

                <label for="pages">Pages</label>
                <input id="pages" name="pages" type="number">

                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4"></textarea>

                <button class="complete-form">Complete</button>
            </form>
        </dialog>

        <dialog id="edit-book-dialog" aria-labelledby="form-title">
            <form method="dialog">
                <h2 id="form-title">Edit book</h2>
                <label for="name">Book name</label>
                <input id="name" name="name" autocomplete="name" required>

                <label for="author">Author</label>
                <input id="author" name="author">

                <label for="pages">Pages</label>
                <input id="pages" name="pages" type="number">

                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4"></textarea>

                <div>
                    <button class="cancel-edit">Cancel</button>
                    <button class="edit-confirm">Edit</button>
                </div>
            </form>
        </dialog>
        <script>
            const dialog = document.querySelector("#edit-book-dialog");

            document.querySelector("#open-add-book-dialog").addEventListener("click", () => {
                dialog.showModal();
            });
            dialog.querySelector(".close-form").addEventListener("click", () => {
                dialog.close();
            });
        </script>
        <div class="page-line"></div>
        <div class="card">
            <div class="card-detail">
                <h2>Name</h2>
                <div class="metadata">
                    <span class="author">Author</span>
                    <span> | </span>
                    <span clas="page">Pages</span>
                </div>
            </div>
            <details class="book-description">
                <summary>More info</summary>
                <p>hi</p>
            </details>
            <div class="card-button">
                <button class="edit-book">Edit</button>
                <button class="read">Mark as finished</button>
            </div>
        </div>
    </body>
</html>
